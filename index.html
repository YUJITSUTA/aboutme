<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yuji Tsuta — Portfolio</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap">
<style>
@property --a1{syntax:'<color>';inherits:true;initial-value:#4f8bff}
@property --a2{syntax:'<color>';inherits:true;initial-value:#8b5cf6}
:root{--a1:#4f8bff;--a2:#8b5cf6;transition:--a1 .7s,--a2 .7s;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--tx:#e8ecf8;--mu:#8e98b8;--bd:rgba(255,255,255,.09);--g:linear-gradient(135deg,var(--a1),var(--a2));--r:22px}
*,*::before,*::after{box-sizing:inherit;margin:0}
html,body{height:100%;overflow:hidden}
body{background:#060914;color:var(--tx);font:400 14px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--a1);outline-offset:2px}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(90px);opacity:.28;animation:drift 28s ease-in-out infinite alternate}
.bg i:nth-child(1){background:var(--a1);left:-15vmax;top:-20vmax}
.bg i:nth-child(2){background:var(--a2);right:-18vmax;bottom:-22vmax;animation-delay:-12s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.12)}}
.app{position:relative;z-index:1;display:grid;grid-template-columns:216px minmax(0,1fr);gap:14px;padding:14px;height:100%}
.glass{position:relative;background:linear-gradient(145deg,rgba(255,255,255,.075),rgba(255,255,255,.02));border:1px solid var(--bd);backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%);box-shadow:0 24px 60px -24px rgba(0,0,0,.7),inset 0 1px 0 rgba(255,255,255,.09)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.07),transparent 32%)}
.side{border-radius:var(--r);padding:22px 14px;display:flex;flex-direction:column;gap:30px;min-height:0}
.brand{display:flex;align-items:center;gap:11px;padding:0 6px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--g);display:grid;place-items:center;font-weight:600;color:#fff;flex:none}
.brand b{display:block;font-weight:600;letter-spacing:.14em;font-size:12.5px}
.brand small{color:var(--mu);letter-spacing:.24em;font-size:9.5px}
nav{position:relative;display:flex;flex-direction:column;gap:4px}
.pill{position:absolute;left:0;top:0;border-radius:13px;background:linear-gradient(135deg,color-mix(in srgb,var(--a1) 28%,transparent),color-mix(in srgb,var(--a2) 18%,transparent));border:1px solid color-mix(in srgb,var(--a1) 40%,transparent);transition:transform .45s cubic-bezier(.3,.9,.3,1),width .45s,height .45s;pointer-events:none}
nav button{position:relative;display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:13px;color:var(--mu);transition:color .25s;text-align:left}
nav button:hover,nav button[aria-current=page]{color:var(--tx)}
nav button[aria-current=page] svg{color:var(--a1)}
.win{border-radius:var(--r);display:flex;flex-direction:column;min-height:0;overflow:hidden;border-color:color-mix(in srgb,var(--a1) 22%,rgba(255,255,255,.08));--mx:50%;--my:30%}
.win::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(520px circle at var(--mx) var(--my),color-mix(in srgb,var(--a1) 11%,transparent),transparent 60%)}
.bar{display:flex;align-items:center;gap:7px;padding:13px 18px;border-bottom:1px solid var(--bd);flex:none}
.bar i{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.16)}
.bar span{margin-left:12px;color:var(--mu);font-size:12px;letter-spacing:.08em}
.view{flex:1;min-height:0;padding:18px;overflow:auto;position:relative;z-index:1;animation:in .5s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:9px}
h1,h2,h3{font-weight:500;letter-spacing:-.01em}
.chip{display:inline-block;padding:3px 11px;border-radius:99px;font-size:11px;letter-spacing:.06em;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);backdrop-filter:blur(8px)}
.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:12px;background:var(--g);color:#fff;font-weight:500;transition:transform .25s,box-shadow .25s,filter .25s;box-shadow:0 8px 24px -10px var(--a1)}
.btn:hover{transform:translateY(-2px);filter:brightness(1.1)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--bd);box-shadow:none}
.home{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:14px;height:100%}
.feat{position:relative;border-radius:18px;overflow:hidden;min-height:0;background:#0a1020}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1.2s ease}
.slide.on{opacity:1}
.slide img,.card img,.th img,.dimg img{width:100%;height:100%;object-fit:cover;display:block}
.slide img{transform:scale(1);transition:transform 7s ease-out}
.slide.on img{transform:scale(1.08)}
.slide:not(.on) img{transition:transform 0s 1.2s}
.fi{position:absolute;left:0;right:0;bottom:0;padding:34px 26px 22px;background:linear-gradient(to top,rgba(5,8,20,.92),rgba(5,8,20,.4) 60%,transparent);display:flex;justify-content:space-between;align-items:flex-end;gap:18px;flex-wrap:wrap}
.fi h2{font-size:clamp(22px,3vw,34px);margin:8px 0 4px}
.fi p{color:#c3cae0;max-width:46ch;margin-bottom:14px}
.swap{animation:in .7s}
.ctl{display:flex;align-items:center;gap:10px}
.arr{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--bd);background:rgba(255,255,255,.07);transition:background .25s}
.arr:hover{background:rgba(255,255,255,.16)}
.dot{width:26px;height:18px;display:grid;place-items:center}
.dot::before{content:"";grid-area:1/1;width:100%;height:3px;border-radius:3px;background:rgba(255,255,255,.22)}
.dot i{grid-area:1/1;height:3px;border-radius:3px;background:var(--g);width:0;justify-self:start}
.dot.on i{animation:fill var(--iv,6s) linear forwards}
.hold .dot.on i{animation:none;width:100%}
@keyframes fill{to{width:100%}}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.row h3{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);font-weight:500}
.link{color:var(--a1);display:inline-flex;align-items:center;gap:5px;font-size:13px}
.ths{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.th{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;border:1px solid var(--bd);text-align:left}
.th img,.card img{transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.th:hover img,.card:hover img{transform:scale(1.07)}
.th span{position:absolute;left:0;right:0;bottom:0;padding:16px 10px 7px;font-size:11.5px;background:linear-gradient(to top,rgba(5,8,20,.9),transparent)}
.th:hover,.card:hover .im{border-color:color-mix(in srgb,var(--a1) 60%,transparent)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.f{padding:6px 14px;border-radius:99px;border:1px solid var(--bd);color:var(--mu);font-size:12.5px;transition:all .25s}
.f:hover{color:var(--tx)}
.f.on{color:#fff;background:var(--g);border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{text-align:left;animation:in .45s both}
.card .im{aspect-ratio:16/10;border-radius:14px;overflow:hidden;border:1px solid var(--bd);transition:border-color .3s}
.card h3{font-size:14px;margin-top:9px}
.card small{color:var(--a1);font-size:11px;letter-spacing:.06em}
.card p{color:var(--mu);font-size:12.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.dimg{border-radius:16px;overflow:hidden;min-height:200px}
.dtx{display:flex;flex-direction:column;justify-content:center;gap:14px;align-items:flex-start}
.dtx h2{font-size:clamp(24px,3vw,34px)}
.dtx p{color:#b6bed6}
.dtx dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;font-size:13px}

.x{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--bd);background:rgba(255,255,255,.08)}
.cols{display:grid;grid-template-columns:1.1fr 1fr;gap:42px;max-width:980px;margin:0 auto;padding:8px 0}
.cols h1{font-size:clamp(26px,3.4vw,40px);line-height:1.15;margin:10px 0 14px;background:var(--g);-webkit-background-clip:text;background-clip:text;color:transparent}
.cols p{color:#b6bed6;margin-bottom:12px}
.lab{color:var(--mu);font-size:11px;letter-spacing:.18em;text-transform:uppercase;margin:0 0 9px}
.sec{margin-bottom:22px}
.tags{display:flex;flex-wrap:wrap;gap:7px}
.tags span{padding:4px 12px;border-radius:99px;border:1px solid var(--bd);font-size:12.5px;background:rgba(255,255,255,.04)}
.tl li{list-style:none;padding:0 0 10px 16px;border-left:1px solid color-mix(in srgb,var(--a1) 50%,transparent);color:#b6bed6;font-size:13px}
.tl b{color:var(--tx);font-weight:500}
form{display:flex;flex-direction:column;gap:14px}
label{font-size:12px;color:var(--mu);display:block;margin-bottom:5px}
input,textarea{width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--bd);background:rgba(255,255,255,.05);color:var(--tx);font:inherit;transition:border-color .25s,background .25s;resize:none}
input:focus,textarea:focus{outline:0;border-color:var(--a1);background:rgba(255,255,255,.08)}
.err{color:#fb7185;font-size:12px;min-height:16px;display:block;margin-top:3px}
.bad{border-color:#fb7185}
.msg{padding:10px 14px;border-radius:12px;font-size:13px;display:none}
.msg.ok{display:block;background:rgba(16,185,129,.14);border:1px solid rgba(16,185,129,.4)}
.msg.no{display:block;background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.4)}
.mail{font-size:18px;display:inline-block;margin:6px 0 16px;border-bottom:1px solid var(--a1)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin:18px 0}
.tc{text-align:left;padding:12px;border-radius:16px;border:1px solid var(--bd);background:rgba(255,255,255,.04);transition:transform .3s,border-color .3s;position:relative}
.tc:hover{transform:translateY(-3px)}
.tc.on{border-color:var(--a1)}
.sw{height:62px;border-radius:10px;margin-bottom:10px}
.tc b{font-weight:500;display:block}.tc small{color:var(--mu)}
.tc em{position:absolute;top:20px;right:20px;width:22px;height:22px;border-radius:50%;background:rgba(6,9,20,.7);display:none;place-items:center;font-style:normal}
.tc.on em{display:grid}
.prev{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
@media(max-width:1024px){.app{grid-template-columns:84px minmax(0,1fr)}.brand div,.lbl{display:none}.brand{justify-content:center}nav button{justify-content:center;padding:13px}.ths{grid-template-columns:repeat(4,1fr)}.ths .th:nth-child(5){display:none}}
@media(max-width:720px){
.app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;padding:10px;gap:10px}
.side{order:2;flex-direction:row;padding:8px;gap:0;border-radius:18px}.brand{display:none}
nav{flex-direction:row;flex:1;gap:0}nav button{flex:1;flex-direction:column;gap:3px;padding:8px 2px;align-items:center}
.lbl{display:block;font-size:10px}
.view{padding:12px}.home{display:flex;flex-direction:column}.feat{flex:none;height:min(62vh,420px)}
.ths{grid-template-columns:repeat(3,1fr)}.ths .th:nth-child(n+4){display:none}
.detail,.cols{grid-template-columns:1fr;gap:20px}.detail{padding:60px 16px 16px}
.fi{padding:22px 16px 14px}.fi p{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}.bg i{animation:none}.slide.on img{transform:none}}
</style>
</head>

theme:'<circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/>',
l:'<path d="m15 18-6-6 6-6"/>',r:'<path d="m9 18 6-6-6-6"/>',arrow:'<path d="M5 12h14"/><path d="m12 5 7 7-7 7"/>',x:'<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
ok:'<path d="M20 6 9 17l-5-5"/>',reset:'<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/>',send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>'};
const ic=(k,s=18)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k]}</svg>`;
const NAV=[['home','Home'],['works','Works'],['about','About'],['contact','Contact'],['theme','Theme Color']];
const art=p=>(p.srcs&&p.srcs[0])||ph(p);const ph=p=>{const i=PROJECTS.indexOf(p),[a,b,c]=p.pal,s=i*53+17;
return'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient><filter id="f"><feGaussianBlur stdDeviation="45"/></filter></defs><rect width="800" height="500" fill="url(#g)"/><g filter="url(#f)" opacity=".85"><circle cx="${140+s%460}" cy="${90+s%260}" r="150" fill="${c}"/><circle cx="${640-s%320}" cy="${390-s%160}" r="130" fill="${a}"/></g><g fill="none" stroke="#fff" stroke-opacity=".38" stroke-width="2"><circle cx="${400+s%90-45}" cy="250" r="92"/><rect x="300" y="160" width="200" height="180" rx="30" transform="rotate(${(i*13)%40-20} 400 250)"/></g></svg>`)};

const root=document.documentElement,view=$('#view'),win=$('#win'),pill=$('#pill'),nav=$('#nav');
let cur='home',cleanup=null,saved=null;
const store={get(){try{return localStorage.getItem('ytp-theme')}catch(e){return null}},set(v){try{localStorage.setItem('ytp-theme',v)}catch(e){}},del(){try{localStorage.removeItem('ytp-theme')}catch(e){}}};
const paint=t=>{root.style.setProperty('--a1',t.a[0]);root.style.setProperty('--a2',t.a[1])};
build(Object.fromEntries(TABS.map(n=>[n,[[FIRST[n]]]])));applyCfg();initTheme();

NAV.forEach(([k,l])=>{const b=document.createElement('button');b.dataset.k=k;b.innerHTML=ic(k)+`<span class="lbl">${l}</span>`;b.setAttribute('aria-label',l);b.onclick=()=>go(k);nav.append(b)});
function place(){const b=$(`nav button[data-k="${cur}"]`);pill.style.width=b.offsetWidth+'px';pill.style.height=b.offsetHeight+'px';pill.style.transform=`translate(${b.offsetLeft}px,${b.offsetTop}px)`}
addEventListener('resize',place);
win.addEventListener('pointermove',e=>{const r=win.getBoundingClientRect();win.style.setProperty('--mx',e.clientX-r.left+'px');win.style.setProperty('--my',e.clientY-r.top+'px')});

function go(k){closeDetail();cleanup&&cleanup();cleanup=null;cur=k;
 $$('nav button').forEach(b=>b.toggleAttribute('aria-current',b.dataset.k===k)||0);
 $$('nav button').forEach(b=>b.dataset.k===k?b.setAttribute('aria-current','page'):b.removeAttribute('aria-current'));
 $('#wt').textContent=NAV.find(n=>n[0]===k)[1];
 view.style.animation='none';void view.offsetWidth;view.style.animation='';view.scrollTop=0;
 if(!PROJECTS.length&&(k==='home'||k==='works'))view.innerHTML=`<p style="color:var(--mu)">${STATUS}</p>`;else ({home,works,about,contact,theme})[k]();place()}

function openDetail(p){closeDetail();const d=document.createElement('div');d.className='detail';d.setAttribute('role','dialog');d.setAttribute('aria-label',p.title);
 d.innerHTML=`<div class="dimg"><img onerror="imgErr(this,${PROJECTS.indexOf(p)})" src="${art(p)}" alt="${p.title}"></div><div class="dtx"><span class="chip">${p.cat}</span><h2>${p.title}</h2><p>${p.desc}</p><dl><dt>Type</dt><dd>${p.type}</dd><dt>Location</dt><dd>${p.loc}</dd><dt>Updated</dt><dd>${p.upd}</dd></dl><a class="btn" href="${p.link}" target="_blank" rel="noopener">Visit project ${ic('arrow',16)}</a></div><button class="x" aria-label="Close">${ic('x')}</button>`;
 win.append(d);const x=$('.x',d);x.onclick=closeDetail;x.focus()}
function closeDetail(){$$('.detail',win).forEach(d=>d.remove())}
addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail()});

function home(){const F=FEAT,ms=CONFIG.secs*1000;
 view.innerHTML=`<div class="home"><section class="feat" id="car" aria-roledescription="carousel" aria-label="Featured projects">
 ${F.map(p=>`<div class="slide"><img onerror="imgErr(this,${PROJECTS.indexOf(p)})" src="${art(p)}" alt="${p.title}" decoding="async"></div>`).join('')}
 <div class="fi"><div class="info"><span class="chip" id="fc"></span><h2 id="ft"></h2><p id="fd"></p><button class="btn" id="fv">View Project ${ic('arrow',16)}</button></div>
 <div class="ctl"><button class="arr" id="pv" aria-label="Previous project">${ic('l')}</button>${F.map((_,i)=>`<button class="dot" aria-label="Go to project ${i+1}"><i></i></button>`).join('')}<button class="arr" id="nx" aria-label="Next project">${ic('r')}</button></div></div></section>
 <section><div class="row"><h3>My Works</h3><button class="link" id="ex">Explore All ${ic('arrow',14)}</button></div><div class="ths">${HOME.map((p,i)=>`<button class="th" data-i="${PROJECTS.indexOf(p)}"><img onerror="imgErr(this,${PROJECTS.indexOf(p)})" src="${art(p)}" alt="" loading="lazy"><span>${p.title}</span></button>`).join('')}</div></section></div>`;
 $('#ex').onclick=()=>go('works');$$('.th').forEach(b=>b.onclick=()=>openDetail(PROJECTS[b.dataset.i]));
 const car=$('#car'),sl=$$('.slide',car),dots=$$('.dot',car),info=$('.info',car);let i=0,t,idle;
 const show=n=>{i=(n+F.length)%F.length;sl.forEach((s,k)=>s.classList.toggle('on',k===i));dots.forEach((d,k)=>{d.classList.remove('on');if(k===i){void d.offsetWidth;d.classList.add('on')}});
  $('#fc').textContent=F[i].cat;$('#ft').textContent=F[i].title;$('#fd').textContent=F[i].desc;info.classList.remove('swap');void info.offsetWidth;info.classList.add('swap')};
 const run=()=>{clearTimeout(t);clearTimeout(idle);car.classList.remove('hold');show(i);t=setTimeout(function tick(){show(i+1);t=setTimeout(tick,ms)},ms)};
 const user=n=>{clearTimeout(t);clearTimeout(idle);car.classList.add('hold');show(n);idle=setTimeout(run,9000)};
 $('#pv').onclick=()=>user(i-1);$('#nx').onclick=()=>user(i+1);dots.forEach((d,k)=>d.onclick=()=>user(k));$('#fv').onclick=()=>openDetail(F[i]);
 car.onpointerenter=()=>{clearTimeout(t);clearTimeout(idle);car.classList.add('hold')};car.onpointerleave=()=>{clearTimeout(idle);idle=setTimeout(run,2500)};
 run();cleanup=()=>{clearTimeout(t);clearTimeout(idle)}}

function works(){let f='All';
 const draw=()=>{$('#gr').innerHTML=PROJECTS.filter(p=>f==='All'||p.cat===f).map((p,i)=>`<button class="card" style="animation-delay:${i*45}ms" data-i="${PROJECTS.indexOf(p)}"><div class="im"><img onerror="imgErr(this,${PROJECTS.indexOf(p)})" src="${art(p)}" alt="" loading="lazy"></div><small>${p.cat}</small><h3>${p.title}</h3><p>${p.desc}</p></button>`).join('')||'<p style="color:var(--mu)">No projects in this category yet.</p>';
  $$('.card').forEach(c=>c.onclick=()=>openDetail(PROJECTS[c.dataset.i]));$$('.f').forEach(b=>b.classList.toggle('on',b.textContent===f))};
 view.innerHTML=`<div class="filters">${['All',...CATS].map(c=>`<button class="f">${c}</button>`).join('')}</div><div class="grid" id="gr"></div>`;
 $$('.f').forEach(b=>b.onclick=()=>{f=b.textContent;draw()});draw()}

function about(){const tg=a=>`<div class="tags">${a.map(x=>`<span>${x}</span>`).join('')}</div>`,by=t=>CONFIG.items.filter(i=>i.t===t).map(i=>i.n),sec=(l,a)=>a.length?`<div class="sec"><p class="lab">${l}</p>${tg(a)}</div>`:'';
 view.innerHTML=`<div class="cols"><div>${CONFIG.photo?`<img src="${CONFIG.photo}" alt="" onerror="this.remove()" style="width:88px;height:88px;border-radius:50%;object-fit:cover;margin-bottom:12px">`:''}<p class="lab">About</p><h1>${CONFIG.full}</h1><p>${CONFIG.summary}</p><p style="color:var(--mu)">${CONFIG.loc}</p>${sec('Creative interests',by('Interest'))}</div><div>${sec('Skills &amp; expertise',by('Skill'))}${sec('Software &amp; tools',by('Tool'))}<div class="sec"><p class="lab">Experience</p><ul class="tl" style="padding:0">${CONFIG.jobs.map(j=>`<li><b>${j.start} – ${j.end}</b> · ${j.title}, ${j.co}<ul style="margin:4px 0 0 16px;padding:0;font-size:12px">${j.res.map(x=>`<li style="border:0;padding:0 0 3px;list-style:disc">${x}</li>`).join('')}</ul></li>`).join('')}</ul></div></div></div>`}

function contact(){
 view.innerHTML=`<div class="cols"><div><p class="lab">Contact</p><h1>${CONFIG.cH}</h1><p>${CONFIG.cI}</p><a class="mail" href="mailto:${CONFIG.email}">${CONFIG.email}</a><p style="color:var(--mu)">${[CONFIG.phone,CONFIG.loc].filter(Boolean).join(' · ')}</p><div class="tags">${CONFIG.socials.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener"><span>${s[0]}</span></a>`).join('')}</div></div>
 <form id="cf" novalidate><div><label for="n">Name</label><input id="n" autocomplete="name"><span class="err" data-e="n"></span></div><div><label for="e">Email</label><input id="e" type="email" autocomplete="email"><span class="err" data-e="e"></span></div><div><label for="m">Message</label><textarea id="m" rows="5"></textarea><span class="err" data-e="m"></span></div><button class="btn" type="submit" style="align-self:flex-start">Send Message ${ic('send',16)}</button><div class="msg" id="st" role="status" aria-live="polite"></div></form></div>`;
 const rules={n:v=>v.trim().length<2?'Please enter your name.':'',e:v=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v.trim())?'':'Please enter a valid email address.',m:v=>v.trim().length<10?'Message should be at least 10 characters.':''};
 const chk=k=>{const el=$('#'+k),m=rules[k](el.value);el.classList.toggle('bad',!!m);$(`[data-e="${k}"]`).textContent=m;return!m};
 Object.keys(rules).forEach(k=>$('#'+k).addEventListener('blur',()=>chk(k)));
 const st=$('#st'),say=(c,t)=>{st.className='msg '+c;st.textContent=t};
 $('#cf').onsubmit=async e=>{e.preventDefault();const ok=Object.keys(rules).map(chk).every(Boolean);if(!ok){say('no','Please fix the highlighted fields and try again.');return}
  const d={name:$('#n').value.trim(),email:$('#e').value.trim(),message:$('#m').value.trim()};
  if(CONFIG.formEndpoint){try{const r=await fetch(CONFIG.formEndpoint,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(d)});if(!r.ok)throw 0;say('ok','Thank you! Your message was sent.');e.target.reset()}catch(x){say('no','Sorry, the message could not be sent. Please email me directly at '+CONFIG.email+'.')}return}
  location.href=`mailto:${CONFIG.email}?subject=${encodeURIComponent('Portfolio message from '+d.name)}&body=${encodeURIComponent(d.message+'\n\n'+d.name+' <'+d.email+'>')}`;
  say('ok','Your email app should open with the message ready to send. (No form backend is connected yet.)')}}

function theme(){
 view.innerHTML=`<div class="cols" style="grid-template-columns:1fr;max-width:900px"><div><p class="lab">Theme Color</p><h1>Choose your accent.</h1><p>Only the accent gradients change. The dark glass stays the same. Hover to preview, click to keep.</p></div><div class="themes">${THEMES.map(t=>`<button class="tc" data-id="${t.id}" aria-pressed="false"><div class="sw" style="background:linear-gradient(135deg,${t.a[0]},${t.a[1]})"></div><em>${ic('ok',13)}</em><b>${t.name}</b><small>${t.note}</small></button>`).join('')}</div>
 <div class="prev"><button class="btn" type="button">Sample button</button><button class="btn ghost" id="rs">${ic('reset',16)} Reset to Default</button></div></div>`;
 const mark=()=>$$('.tc').forEach(b=>{const on=b.dataset.id===saved.id;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)});mark();
 $$('.tc').forEach(b=>{const t=THEMES.find(x=>x.id===b.dataset.id);b.onpointerenter=()=>paint(t);b.onpointerleave=()=>paint(saved);b.onfocus=()=>paint(t);b.onblur=()=>paint(saved);b.onclick=()=>{saved=t;paint(t);store.set(t.id);mark()}});
 $('#rs').onclick=()=>{saved=THEMES.find(t=>t.def)||THEMES[0];paint(saved);store.del();mark()}}

go('home');$('#src').textContent='Loading…';
load().then(T=>{build(T);applyCfg();initTheme();$('#src').textContent='Live from Google Sheets';if(cur!=='contact'&&!$('.detail'))go(cur)}).catch(()=>{STATUS='Could not load content from Google Sheets. Make sure the sheet is a native Google Sheet shared as “Anyone with the link: Viewer”, then refresh.';$('#src').textContent='Sheet unavailable';if(!PROJECTS.length&&(cur==='home'||cur==='works'))go(cur)});
</script>
</body>
</html>
